# factory.conf — how the factory works in this repo (see the kit README for every key).
TEST_CMD="pytest -q -p no:cacheprovider"
LINT_CMD="ruff check --no-cache ."
SCOPE="app/ tests/"
PATH_PREPEND="venv/bin"
RUNTIME="python3"
PROTECT_EXTRA="venv requirements.txt"
SETUP="python3 -m venv venv && venv/bin/pip install -q -r requirements.txt"
